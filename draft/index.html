<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorey</title>
<meta name="theme-color" content="#0A0E1A">
<style>
  html,body{margin:0;height:100%;background:#0A0E1A;color:#F5F1E8;
    font:400 15px/1.5 system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#A78BFA}
</style>
<script>
  // ON NETTOIE AVANT DE PARTIR. Le service worker de l'ancienne version
  // est désinstallé et ses caches vidés : sans ça, il continuerait à
  // servir une application figée à qui revient par ce lien.
  (function () {
    var apres = function () { location.replace('/app/'); };
    var fait = false;
    var partir = function () { if (!fait) { fait = true; apres(); } };
    try {
      var taches = [];
      if ('serviceWorker' in navigator) {
        taches.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        taches.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(taches).then(partir).catch(partir);
    } catch (e) { partir(); }
    // Et on part de toute façon, même si le ménage traîne.
    setTimeout(partir, 1500);
  })();
</script>
</head>
<body><p>Vorey · <a href="/app/">ouvrir l'application</a></p></body>
</html>
