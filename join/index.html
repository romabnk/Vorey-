<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Tokens — dérivés de lib/theme/app_theme.dart (VoreyColors). */
  :root {
    --night: #0B1026;          /* bleu nuit marbellí */
    --ivory: #F5F1E8;
    --ivory-dim: rgba(245, 241, 232, 0.66);
    --line: rgba(245, 241, 232, 0.16);
    --field: rgba(20, 26, 58, 0.72);
    --violet: #A78BFA;         /* brandViolet */
    --blue: #3B82F6;           /* brandBlue */
    --gold: #C7A67A;           /* or : UNIQUEMENT le contour et le numéro de la Carte Fondateur */
    --gold-hi: #E7C996;
    --brand-grad: linear-gradient(90deg, var(--violet), var(--blue));
    --error: #E0A090;
    --display: "Playfair Display", Georgia, serif;
    --body: "Montserrat", system-ui, sans-serif;
    --radius: 14px;
    /* LA PHOTO DE FOND : vide pour l'instant. Pour la mettre, une ligne :
       --hero-photo: url("marbella.jpg"); */
    --hero-photo: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    background-color: var(--night);
    background-image:
      linear-gradient(180deg, rgba(11,16,38,.15) 0%, rgba(11,16,38,.55) 38%, var(--night) 62%),
      var(--hero-photo),
      radial-gradient(70% 38% at 50% 30%, rgba(167,139,250,.20), transparent 70%),
      radial-gradient(120% 50% at 50% 0%, #1D2350 0%, var(--night) 70%);
    background-repeat: no-repeat;
    background-size: 100% 100%, cover, 100% 100%, 100% 100%;
    background-position: top center;
    color: var(--ivory);
    font: 400 15px/1.55 var(--body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  button, select, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 8px; }

  .page { max-width: 460px; min-height: 100svh; margin: 0 auto;
          padding: calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
          display: flex; flex-direction: column; }

  /* ── En-tête : le logo officiel ── */
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 28px; height: 28px; object-fit: contain; }
  .brand span { font: 400 19px/1 var(--display); letter-spacing: 0.32em; }
  .lang { position: relative; }
  .lang select {
    appearance: none; background: transparent; border: 0; color: var(--ivory);
    font: 600 13px/1 var(--body); letter-spacing: .04em; padding: 8px 18px 8px 6px; cursor: pointer;
  }
  .lang select option { color: #111; }
  .lang::after { content: ""; position: absolute; right: 4px; top: 50%; width: 6px; height: 6px; border: solid var(--ivory); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .demo { font: 600 9px/1 var(--body) !important; letter-spacing: .14em !important; text-transform: uppercase; color: #fff; background: var(--brand-grad); border-radius: 4px; padding: 3px 5px; }

  /* ── Le logo ── */
  .mark { display: block; margin: 8px auto 0; width: min(54vw, 220px); aspect-ratio: 1; }
  .mark.sm { width: min(40vw, 150px); }

  .headline { font: 400 clamp(28px, 8vw, 34px)/1.2 var(--display); text-align: center; margin: 4px 0 8px; text-wrap: balance; }
  .sub { text-align: center; color: var(--ivory-dim); margin: 0 0 24px; text-wrap: balance; }

  /* ── Les 3 idées ── */
  .steps { list-style: none; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: start; margin: 0 0 24px; padding: 0; }
  .steps li { display: grid; justify-items: center; gap: 8px; font: 500 12.5px/1.25 var(--body); text-align: center; }
  .steps svg { width: 26px; height: 26px; stroke: url(#brandGrad); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .steps .dash { width: 18px; height: 1px; background: var(--line); margin-top: 13px; }

  /* ── Formulaires ── */
  form { display: grid; gap: 10px; }
  .input { position: relative; }
  .input svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--ivory-dim); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .input input {
    width: 100%; font-size: 16px; color: var(--ivory);
    background: var(--field); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 16px 16px 46px; transition: border-color .2s;
  }
  .input input::placeholder { color: var(--ivory-dim); }
  .input input:focus { outline: none; border-color: var(--violet); }
  .input input[aria-invalid="true"] { border-color: var(--error); }

  .agree { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ivory-dim); margin: 6px 0 4px; cursor: pointer; }
  .agree input { appearance: none; flex: none; width: 18px; height: 18px; margin: 0; border: 1px solid rgba(245,241,232,.4); border-radius: 5px; display: grid; place-content: center; cursor: pointer; }
  .agree input::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
  .agree input:checked { background: var(--violet); border-color: var(--violet); }
  .agree input:checked::after { opacity: 1; }
  .agree input[aria-invalid="true"] { border-color: var(--error); }
  .agree button { background: none; border: 0; padding: 0; color: var(--ivory); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }

  .primary {
    width: 100%; margin-top: 8px; padding: 18px 20px;
    font: 500 16px/1 var(--body); color: #fff;
    border: 0; border-radius: 999px;
    background: var(--brand-grad);
    box-shadow: 0 12px 30px -12px rgba(110, 120, 250, .7);
    cursor: pointer; transition: filter .2s, transform .1s;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: translateY(1px); }
  .primary[disabled] { filter: saturate(.5) brightness(.85); cursor: progress; }
  .secondary {
    width: 100%; margin-top: 10px; padding: 17px 20px;
    font: 500 16px/1 var(--body); color: var(--ivory);
    background: transparent; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  }
  .text-link { display: block; margin: 18px auto 0; background: none; border: 0; padding: 6px; color: var(--ivory-dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  .error { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--error); text-align: center; }
  .invited-by { text-align: center; font-size: 13px; color: var(--ivory-dim); margin: -12px 0 18px; }
  .invited-by strong { color: var(--ivory); font-weight: 600; }
  .promise { margin: 14px 0 0; font-size: 12px; color: var(--ivory-dim); text-align: center; }

  /* ── Le code reçu par e-mail : six cases ── */
  .code-text { text-align: center; color: var(--ivory-dim); margin: 0 0 24px; }
  .code-text strong { display: block; color: var(--ivory); font-weight: 600; overflow-wrap: anywhere; }
  .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 0 0 6px; border: 0; padding: 0; }
  .otp input {
    width: 100%; min-width: 0; aspect-ratio: 0.82; padding: 0;
    text-align: center; color: var(--ivory); caret-color: var(--violet);
    font: 600 clamp(22px, 7vw, 28px)/1 var(--body); font-variant-numeric: tabular-nums;
    background: var(--field); border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .otp input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(167,139,250,.25); }
  .otp input.filled { border-color: rgba(167,139,250,.6); background: rgba(167,139,250,.08); }
  .otp[aria-invalid="true"] input { border-color: var(--error); box-shadow: none; }
  .code-actions { display: flex; justify-content: center; gap: 22px; margin-top: 18px; font-size: 13px; }
  .code-actions button { background: none; border: 0; padding: 4px 0; color: var(--ivory); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
  .code-actions button[disabled] { color: var(--ivory-dim); text-decoration: none; cursor: default; }

  /* ── My Vorey : la Carte Fondateur ── */
  .greet { font: 600 clamp(22px, 6.4vw, 26px)/1.25 var(--body); letter-spacing: -.01em; text-align: center; margin: 16px 0 18px; text-wrap: balance; }
  .card {
    position: relative; margin: 0 0 24px; padding: 20px 22px;
    aspect-ratio: 1.586;                       /* le format d'une vraie carte */
    display: grid; grid-template-rows: auto 1fr auto;
    border-radius: 20px; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(167,139,250,.24), transparent 55%),
      radial-gradient(90% 80% at 100% 100%, rgba(59,130,246,.16), transparent 60%),
      linear-gradient(155deg, #1A1F40 0%, #11152F 55%, #0C1026 100%);
    border: 1px solid rgba(199,166,122,.6);
    box-shadow: 0 28px 56px -26px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);
  }
  /* Un reflet très doux, comme sur une carte en métal. */
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(118deg, transparent 32%, rgba(255,255,255,.07) 46%, transparent 60%);
  }
  .card-top, .card-bottom { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-bottom { align-items: flex-end; }
  .card-label { font: 500 10.5px/1.5 var(--body); letter-spacing: .22em; text-transform: uppercase; color: rgba(245,241,232,.82); }
  .card-num { font: 400 21px/1 var(--display); color: var(--gold-hi); letter-spacing: .02em; }
  .card-num small { font-size: .62em; margin-right: 3px; letter-spacing: .08em; }
  .card .mark { width: 34%; margin: 0 auto; align-self: center; }
  .card-name { font: 400 clamp(22px, 6.6vw, 27px)/1 var(--display); }
  .card-place { font: 500 10px/1 var(--body); letter-spacing: .26em; text-transform: uppercase; color: var(--ivory-dim); padding-bottom: 3px; }

  .stats { display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; text-align: center; margin: 0 0 18px; }
  .stats .sep { height: 46px; background: var(--line); }
  .stats b { display: block; font: 400 30px/1.1 var(--display); }
  .stats span { font-size: 13.5px; color: var(--ivory-dim); }

  .keep { margin: 30px 0 0; padding: 20px; border-radius: 18px; background: var(--field); border: 1px solid var(--line); text-align: center; }
  .keep h2 { font: 400 22px/1.2 var(--display); margin: 0 0 6px; }
  .keep p { margin: 0 0 14px; font-size: 14px; color: var(--ivory-dim); }
  .keep .secondary { margin-top: 0; }
  .later { margin: 26px 0 0; text-align: center; font-size: 13.5px; color: var(--ivory-dim); }

  /* ── Feuilles (QR, écran d'accueil) ── */
  .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 8, 20, .62); }
  .sheet-box { width: 100%; max-width: 460px; padding: 26px 22px calc(24px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
               background: #121734; border: 1px solid var(--line); border-bottom: 0; text-align: center;
               animation: up .32s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { font: 400 24px/1.2 var(--display); margin: 0 0 6px; }
  .sheet p { margin: 0 0 18px; color: var(--ivory-dim); font-size: 14px; }
  .qr-box { width: min(72vw, 280px); aspect-ratio: 1; margin: 6px auto 16px; padding: 14px; border-radius: 22px; background: #fff; }
  .qr-box canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .qr-link { font: 500 13px/1.3 var(--body); color: var(--ivory-dim); margin: 0 0 18px; overflow-wrap: anywhere; }
  .ios-steps { list-style: none; margin: 4px 0 20px; padding: 0; display: grid; gap: 12px; text-align: left; }
  .ios-steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; font-size: 15px; }
  .ios-steps li i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-content: center; font: 600 13px/1 var(--body); font-style: normal; background: var(--brand-grad); color: #fff; }
  .ios-steps svg { width: 18px; height: 18px; vertical-align: -3px; stroke: var(--violet); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
           padding: 12px 18px; border-radius: 999px; background: #1C2250; border: 1px solid var(--line); font-size: 14px; }

  /* ── Le lot (système existant, caché : seulement par le lien d'un gagnant) ── */
  .win-title { font: 400 clamp(40px, 12vw, 52px)/1 var(--display); text-align: center; margin: 0 0 10px; }
  .win-sub { font: 400 22px/1.3 var(--display); text-align: center; margin: 0 0 6px; }
  .win-hint { text-align: center; font-size: 14px; color: var(--ivory-dim); margin: 0 0 20px; }
  .grad { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .code-box { padding: 18px; text-align: center; border-radius: 16px; background: var(--field); border: 1px solid var(--line); }
  .code-box .k { font: 600 11px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; margin: 0 0 10px; }
  .code-box code { display: block; font: 600 clamp(22px, 7vw, 26px)/1 var(--body); letter-spacing: .06em; }
  .venue { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 14px 0 0; font-size: 13px; color: var(--ivory-dim); }
  .venue svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .state { margin: 40px auto 0; max-width: 300px; padding: 26px 20px; text-align: center; border-radius: 18px; background: var(--field); border: 1px solid var(--line); }
  .state .mark { width: 100px; margin: 0 auto 6px; }
  .state h2 { font: 400 22px/1.2 var(--display); margin: 0 0 6px; }
  .state p { margin: 0; font-size: 13px; color: var(--ivory-dim); }

  /* ── Pied ── */
  footer { margin-top: auto; padding-top: 28px; text-align: center; font-size: 12px; color: var(--ivory-dim); }
  footer button, footer a { background: none; border: 0; padding: 0; color: inherit; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  #privacyText { margin: 10px 0 0; line-height: 1.6; text-align: left; }

  [hidden] { display: none !important; }
  .reveal { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 340px) { .page { padding-left: 16px; padding-right: 16px; } .steps li { font-size: 11.5px; } .demo { display: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal, .sheet-box { animation: none; } .otp input { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.8 2.9-6 6.5-6s6.5 2.2 6.5 6"/><circle cx="17" cy="9" r="3"/><path d="M17 14c2.8 0 4.5 1.9 4.5 5"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="i-ios-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></symbol>
  <symbol id="i-plus-box" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
</svg>

<div class="page">
  <header>
    <span class="brand"><img src="vorey_mark.png" alt="" width="28" height="28"><span>VOREY</span><span class="demo" id="demoBadge" hidden>Demo</span></span>
    <span class="lang">
      <select id="lang" aria-label="Language">
        <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
      </select>
    </span>
  </header>

  <main>
    <!-- A. AVANT DE REJOINDRE -->
    <section id="join" hidden>
      <canvas class="mark" id="markJoin" aria-hidden="true"></canvas>
      <h1 class="headline" data-t="hey"></h1>
      <p class="sub" data-t="early"></p>
      <ol class="steps">
        <li><svg><use href="#i-user"/></svg><span data-t="step1"></span></li>
        <li class="dash" aria-hidden="true"></li>
        <li><svg><use href="#i-card"/></svg><span data-t="step2"></span></li>
        <li class="dash" aria-hidden="true"></li>
        <li><svg><use href="#i-users"/></svg><span data-t="step3"></span></li>
      </ol>
      <p class="invited-by" id="invitedBy" hidden></p>
      <form id="form" novalidate>
        <div class="input">
          <svg><use href="#i-user"/></svg>
          <input id="firstName" autocomplete="given-name" maxlength="40" data-ph="firstName">
        </div>
        <div class="input">
          <svg><use href="#i-mail"/></svg>
          <input id="email" type="email" inputmode="email" autocomplete="email" maxlength="254" data-ph="email">
        </div>
        <label class="agree">
          <input type="checkbox" id="consent">
          <span><span data-t="agree"></span> <button type="button" class="privacy-open" data-t="privacyNotice"></button></span>
        </label>
        <button class="primary" type="submit" id="submit" data-t="submit"></button>
        <p class="error" id="error" role="alert"></p>
      </form>
      <p class="promise" data-t="promise"></p>
      <button type="button" class="text-link" id="toBack" data-t="alreadyMember"></button>
    </section>

    <!-- WELCOME BACK : retrouver son Vorey avec son e-mail -->
    <section id="back" hidden aria-labelledby="backTitle">
      <canvas class="mark sm" id="markBack" aria-hidden="true"></canvas>
      <h1 class="headline" id="backTitle" data-t="welcomeBack" tabindex="-1"></h1>
      <p class="sub" data-t="backText"></p>
      <form id="backForm" novalidate>
        <div class="input">
          <svg><use href="#i-mail"/></svg>
          <input id="backEmail" type="email" inputmode="email" autocomplete="email" maxlength="254" data-ph="email">
        </div>
        <button class="primary" type="submit" id="backSubmit" data-t="sendCode"></button>
        <p class="error" id="backError" role="alert"></p>
      </form>
      <button type="button" class="text-link" id="toJoin" data-t="notMember"></button>
    </section>

    <!-- LE CODE (6 cases) -->
    <section id="code" hidden aria-labelledby="codeTitle">
      <canvas class="mark sm" id="markCode" aria-hidden="true"></canvas>
      <h1 class="headline" id="codeTitle" data-t="codeTitle" tabindex="-1"></h1>
      <p class="code-text" id="codeText"></p>
      <form id="codeForm" novalidate>
        <fieldset class="otp" id="otp" role="group">
          <input inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*">
          <input inputmode="numeric" autocomplete="off" pattern="[0-9]*">
          <input inputmode="numeric" autocomplete="off" pattern="[0-9]*">
          <input inputmode="numeric" autocomplete="off" pattern="[0-9]*">
          <input inputmode="numeric" autocomplete="off" pattern="[0-9]*">
          <input inputmode="numeric" autocomplete="off" pattern="[0-9]*">
        </fieldset>

      const halo = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      halo.addColorStop(0, 'rgba(150,130,250,.24)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = halo; g.fillRect(0, 0, S, S);
      g.drawImage(tintedLogo(S, o.dim), 0, 0);
    }
  }
  const refreshMarks = () => logoReady.then(() => requestAnimationFrame(drawMarks));
  addEventListener('resize', refreshMarks);

  // ════════════════════════════════════════════════════════════════════
  // RENDU
  // ════════════════════════════════════════════════════════════════════
  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t[el.dataset.ph]; el.setAttribute('aria-label', t[el.dataset.ph]); });
    $('privacyText').innerHTML = t.privacy(t.contact(cfg && cfg.contactEmail ? esc(cfg.contactEmail) : null));
    const rulesUrl = cfg && cfg.rulesUrl;
    $('rules').hidden = $('rulesSep').hidden = !rulesUrl;
    if (rulesUrl) $('rules').href = rulesUrl;
    $('demoBadge').hidden = !DEMO;
    $('invitedBy').hidden = !inviter;
    if (inviter) $('invitedBy').innerHTML = t.invitedBy(esc(inviter));
    $('otp').setAttribute('aria-label', t.codeLabelInput);
    boxes.forEach((b, i) => b.setAttribute('aria-label', `${t.codeLabelInput} · ${i + 1}/6`));
    if (pending) $('codeText').innerHTML = (pending.mode === 'back' ? t.codeTextNeutral : t.codeText)(esc(pending.email));
    $('homeStep1').innerHTML = isIOS ? t.iosStep1 : t.otherStep1;
    $('homeStep2').innerHTML = isIOS ? t.iosStep2 : t.otherStep2;
    ['join', 'back', 'code', 'me', 'win'].forEach(v => { $(v).hidden = view !== v; });
    if (view === 'me') renderMe(t);
    if (view === 'win') renderWin(t);
  }

  function renderMe(t) {
    const name = card.first_name;
    $('greet').textContent = firstTime ? t.foundYou(name) : t.greet(new Date().getHours(), name);
    $('cardLabel').innerHTML = card.founder ? t.founding : t.member;
    $('cardNum').innerHTML = `<small>Nº</small> ${String(card.member_number).padStart(4, '0')}`;
    $('cardName').textContent = name;
    $('card').setAttribute('aria-label', `${card.founder ? t.founding.replace('<br>', ' ') : t.member} nº ${card.member_number}, ${name}`);
    $('chances').textContent = card.chances;
    $('chancesLabel').textContent = t.chances(card.chances);
    $('brought').textContent = card.friends_joined;
    $('broughtLabel').textContent = t.brought(card.friends_joined);
    // L'invitation à garder Vorey sur l'écran d'accueil : seulement sur
    // téléphone, et seulement si ce n'est pas déjà fait.
    $('keep').hidden = isStandalone() || !(isIOS || isAndroid || installPrompt);
  }

  function renderWin(t) {
    const status = win && win.status;
    const bad = status === 'expired' || status === 'unknown';
    $('winMain').hidden = bad;
    $('winState').hidden = !bad;
    if (bad) {
      $('stateTitle').textContent = status === 'expired' ? t.expiredTitle : t.invalidTitle;
      $('stateText').textContent = status === 'expired' ? t.expiredText : t.invalidText;
      return;
    }
    const done = status === 'claimed';
    $('prize').hidden = !done;
    if (done) $('prize').textContent = win.prize;
    $('winHint').textContent = done ? t.shownOnce : t.winHint;
    $('claim').hidden = done;
    $('codeBox').hidden = !done;
    if (done) $('coupon').textContent = win.coupon;
  }

  function show(v) {
    view = v; render(); refreshMarks();
    const el = $(v);
    el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');
    scrollTo({ top: 0, behavior: 'auto' });
  }

  function openMe(c, isFirst) {
    card = c; firstTime = !!isFirst; pending = null; clearInterval(resendTimer);
    store.set('code', null);   // ancien stockage (code de parrainage) : n'ouvre plus rien
    show('me');
  }

  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 1800);
  }

  // ════════════════════════════════════════════════════════════════════
  // REJOINDRE, REVENIR, CONFIRMER
  // ════════════════════════════════════════════════════════════════════
  $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); render(); });
  document.querySelectorAll('.privacy-open').forEach(b => b.addEventListener('click', () => {
    $('privacyText').hidden = false;
    $('privacyText').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
  }));
  $('toBack').addEventListener('click', () => { show('back'); $('backEmail').focus(); });
  $('toJoin').addEventListener('click', () => { show('join'); $('firstName').focus(); });

  function fail(field, key) {
    ['firstName', 'email', 'consent'].forEach(id => $(id).removeAttribute('aria-invalid'));
    $('error').textContent = key ? T[lang][key] : '';
    if (field) { $(field).setAttribute('aria-invalid', 'true'); $(field).focus(); }
  }
  const validEmail = e => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e);

  function goToCode(email, mode) {
    pending = { email, mode };
    setCode(''); $('codeError').textContent = '';
    show('code');
    startResendTimer(30);
    boxes[0].focus({ preventScroll: true });
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('firstName').value.trim().replace(/\s+/g, ' ');
    const email = $('email').value.trim().toLowerCase();
    if (!name) return fail('firstName', 'errName');
    if (!validEmail(email)) return fail('email', 'errEmail');
    if (!$('consent').checked) return fail('consent', 'errConsent');
    fail(null, null);
    const btn = $('submit');
    btn.disabled = true; btn.textContent = T[lang].saving;
    try {
      await rpc('join_waitlist', {
        p_email: email, p_first_name: name, p_consent: true, p_consent_version: CONSENT_VERSION,
        p_referral_code: ref, p_locale: lang, p_source: source,
      });
      goToCode(email, 'join');
    } catch (err) {
      const map = { invalid_email: ['email', 'errEmail'], invalid_first_name: ['firstName', 'errName'], consent_required: ['consent', 'errConsent'] };
      const [f, k] = map[err.code] || [null, 'errNetwork'];
      fail(f, k);
    } finally {
      btn.disabled = false; btn.textContent = T[lang].submit;
    }
  });

  $('backForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('backEmail').value.trim().toLowerCase();
    $('backEmail').removeAttribute('aria-invalid');
    if (!validEmail(email)) { $('backEmail').setAttribute('aria-invalid', 'true'); $('backError').textContent = T[lang].errEmail; return; }
    $('backError').textContent = '';
    const btn = $('backSubmit');
    btn.disabled = true; btn.textContent = T[lang].saving;
    try { await rpc('request_waitlist_code', { p_email: email }); goToCode(email, 'back'); }
    catch { $('backError').textContent = T[lang].errNetwork; }
    finally { btn.disabled = false; btn.textContent = T[lang].sendCode; }
  });

  function startResendTimer(n) {
    clearInterval(resendTimer);
    const b = $('resend');
    const tick = () => {
      if (n <= 0) { clearInterval(resendTimer); b.disabled = false; b.textContent = T[lang].resend; return; }
      b.disabled = true; b.textContent = T[lang].resendIn(n); n--;
    };
    tick(); resendTimer = setInterval(tick, 1000);
  }

  async function verifyCode() {
    const code = getCode();
    if (code.length !== 6) return;
    const btn = $('verify');
    btn.disabled = true; btn.textContent = T[lang].verifying;
    $('otp').removeAttribute('aria-invalid'); $('codeError').textContent = '';
    try {
      const r = await rpc('confirm_waitlist_email', { p_email: pending.email, p_code: code });
      if (r.status === 'confirmed') { store.set('session', r.session); openMe(r.card, r.first_time); return; }
      $('codeError').textContent = T[lang].errCode(r.attempts_left);
      $('otp').setAttribute('aria-invalid', 'true'); setCode(''); boxes[0].focus();
    } catch (err) {
      const key = { code_expired: 'errExpired', too_many_attempts: 'errExpired', invalid_code: 'errExpired' }[err.code] || 'errNetwork';
      $('codeError').textContent = T[lang][key];
      $('otp').setAttribute('aria-invalid', 'true');
    } finally {
      btn.disabled = false; btn.textContent = T[lang].verify;
    }
  }
  $('codeForm').addEventListener('submit', e => { e.preventDefault(); verifyCode(); });

  // Les six cases : on tape → case suivante ; Effacer → case précédente ;
  // on colle (ou iOS remplit) → tout se répartit d'un coup.
  const boxes = [...document.querySelectorAll('#otp input')];
  const getCode = () => boxes.map(b => b.value).join('');
  function setCode(digits, from = 0) {
    digits = digits.replace(/\D/g, '');
    boxes.forEach((b, i) => {
      if (i >= from) b.value = digits[i - from] || '';
      b.classList.toggle('filled', !!b.value);
    });
  }
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      const v = box.value.replace(/\D/g, '');
      $('otp').removeAttribute('aria-invalid');
      if (v.length > 1) {
        setCode(v.slice(0, 6 - i), i);
        boxes[Math.min(i + v.length, 5)].focus();
      } else {
        box.value = v;
        box.classList.toggle('filled', !!v);
        if (v && i < 5) boxes[i + 1].focus();
      }
      if (getCode().length === 6) verifyCode();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        e.preventDefault(); boxes[i - 1].value = ''; boxes[i - 1].classList.remove('filled'); boxes[i - 1].focus();
      } else if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); boxes[i - 1].focus(); }
      else if (e.key === 'ArrowRight' && i < 5) { e.preventDefault(); boxes[i + 1].focus(); }
    });
    box.addEventListener('focus', () => box.select());
    box.addEventListener('paste', e => {
      const v = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      if (!v) return;
      e.preventDefault();
      setCode(v.slice(0, 6 - i), i);
      boxes[Math.min(i + v.length, 5)].focus();
      if (getCode().length === 6) verifyCode();
    });
  });

  $('resend').addEventListener('click', async () => {
    $('codeError').textContent = '';
    try {
      if (pending.mode === 'back') await rpc('request_waitlist_code', { p_email: pending.email });
      else await rpc('join_waitlist', {
        p_email: pending.email, p_first_name: $('firstName').value.trim(), p_consent: true, p_consent_version: CONSENT_VERSION,
        p_referral_code: ref, p_locale: lang, p_source: source,
      });
      startResendTimer(30);
      $('codeError').textContent = T[lang].resent;
    } catch {
      $('codeError').textContent = T[lang].errNetwork;
    }
  });
  $('changeEmail').addEventListener('click', () => {
    const mode = pending ? pending.mode : 'join';
    clearInterval(resendTimer); pending = null;
    show(mode);
    const input = mode === 'back' ? $('backEmail') : $('email');
    input.focus(); input.select();
  });

  // ════════════════════════════════════════════════════════════════════
  // MY VOREY : PARTAGER, MON QR, ÉCRAN D'ACCUEIL
  // ════════════════════════════════════════════════════════════════════
  $('bring').addEventListener('click', async () => {
    const url = shareLink();
    if (navigator.share) {
      try { await navigator.share({ title: 'Vorey', text: T[lang].shareText, url }); } catch {}
      return;
    }
    try { await navigator.clipboard.writeText(url); toast(T[lang].copied); }
    catch { prompt('', url); }
  });

  function openSheet(id) { $(id).hidden = false; $(id).querySelector('[data-close]').focus(); }
  document.querySelectorAll('.sheet').forEach(s => {
    s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) s.hidden = true; });
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.sheet').forEach(s => { s.hidden = true; }); });

  // Le QR personnel : dessiné ici, à partir du MÊME lien de parrainage —
  // public par nature, il ne contient jamais la session.
  $('showQr').addEventListener('click', () => {
    const url = shareLink();
    $('qrSub').textContent = T[lang].qrSub(card.first_name);
    $('qrLink').textContent = url.replace(/^https?:\/\//, '');
    const canvas = $('qrCanvas');
    if (window.qrcode) {
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      const n = qr.getModuleCount(), q = 2, cell = 10, S = (n + q * 2) * cell;
      canvas.width = canvas.height = S;
      const g = canvas.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
      g.fillStyle = '#0B1026';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) g.fillRect((c + q) * cell, (r + q) * cell, cell, cell);
    }
    openSheet('qrSheet');
  });

  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (view === 'me') render(); });
  addEventListener('appinstalled', () => { installPrompt = null; if (view === 'me') render(); });
  $('install').addEventListener('click', async () => {
    // Android / Chrome : la vraie installation. iPhone : impossible à
    // déclencher depuis la page — on montre les deux vrais gestes.
    if (installPrompt) {
      installPrompt.prompt();
      try { await installPrompt.userChoice; } catch {}
      installPrompt = null; render();
      return;
    }
    $('inAppNote').hidden = !(isIOS && isInApp);
    openSheet('homeSheet');
  });

  if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});

  // ════════════════════════════════════════════════════════════════════
  // LE LOT (système existant, inchangé)
  // ════════════════════════════════════════════════════════════════════
  $('claim').addEventListener('click', async () => {
    const btn = $('claim');
    btn.disabled = true; btn.textContent = T[lang].claiming; $('winError').textContent = '';
    try { win = await rpc('claim_prize', { p_token: winToken }); show('win'); }
    catch { $('winError').textContent = T[lang].errNetwork; }
    finally { btn.disabled = false; btn.textContent = T[lang].claim; }
  });

  // ════════════════════════════════════════════════════════════════════
  // AU CHARGEMENT
  // ════════════════════════════════════════════════════════════════════
  if (winToken) { show('win'); return; }
  render();
  (async () => {
    // Ni le jeton de confirmation, ni l'ancien ?me= ne restent dans l'adresse.
    if (confirmToken || legacyMe) {
      const keep = new URLSearchParams(location.search);
      ['confirm', 'me'].forEach(k => keep.delete(k));
      history.replaceState(null, '', location.pathname + (keep.toString() ? '?' + keep : ''));
    }

    // 1. Arrivé par le bouton d'un e-mail (confirmation, ou « My Vorey »).
    if (confirmToken) {
      try {
        const r = await rpc('confirm_waitlist_link', { p_token: confirmToken });
        if (r.status === 'confirmed') { store.set('session', r.session); openMe(r.card, r.first_time); return; }
      } catch {}
    }

    // 2. Une session sur cet appareil : My Vorey, tout de suite.
    const session = store.get('session');
    if (session) {
      try { const c = await rpc('my_vorey', { p_session: session }); if (c) { openMe(c, false); return; } }
      catch {}
      store.set('session', null);
    }

    // 3. Ancien lien ?me=, ancien stockage, lien expiré : « Welcome back ».
    if (legacyMe || store.get('code') || confirmToken) {
      show('back');
      if (confirmToken) $('backError').textContent = T[lang].errLink;
      return;
    }

    // 4. Sinon : rejoindre (et le prénom du parrain, s'il y en a un).
    show('join');
    if (ref) {
      try { const r = await rpc('waitlist_status', { p_referral_code: ref }); if (r && r.first_name) { inviter = r.first_name; render(); } }
      catch {}
    }
  })();
})();
</script>
</body>
</html>
