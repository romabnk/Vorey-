<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victor · Vorey</title>
<!--
  ════════════════════════════════════════════════════════════════════
  VICTOR, TOUT SEUL.

  POURQUOI CETTE PAGE EXISTE. L'app Flutter met une dizaine de secondes
  à démarrer, garde son cache, et traîne tout un parcours derrière elle.
  Pour juger la façon de parler de Victor, tout cela est du bruit.

  Ici il n'y a que lui : une page qui s'ouvre en un instant, qui parle
  au MÊME serveur que l'app, avec les mêmes réglages et le même micro.
  Ce que tu lis ici est exactement ce que l'app recevra.
  ════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#070A14; --nuit2:#0C101E; --verre1:#D91B2136; --verre2:#E00C101E;
    --violet:#A78BFA; --bleu:#3B82F6; --or:#C7A67A; --creme:#F5F1E8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--nuit);color:var(--creme);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif}
  body{display:flex;justify-content:center}
  main{width:100%;max-width:560px;display:flex;flex-direction:column;height:100dvh}
  header{padding:18px 20px 10px;display:flex;align-items:center;gap:12px}
  header .nom{font-family:"Playfair Display",serif;font-size:21px;color:var(--or)}
  header .etat{margin-left:auto;font-size:12px;opacity:.45}
  .reglages{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 12px;
    scrollbar-width:none}
  .reglages::-webkit-scrollbar{display:none}
  .reglages button{flex:0 0 auto;border-radius:999px;border:1px solid rgba(167,139,250,.28);
    background:rgba(255,255,255,.04);color:var(--creme);opacity:.6;
    font:500 13.5px "DM Sans";padding:9px 14px;cursor:pointer}
  .reglages button.rempli{opacity:1;background:rgba(167,139,250,.14);
    border-color:rgba(167,139,250,.5)}
  #fil{flex:1;overflow-y:auto;padding:4px 20px 8px}
  .lui{margin-bottom:18px}
  .carte{background:linear-gradient(to bottom,#1B2136D9,#0C101EE0);
    border:1px solid rgba(167,139,250,.28);border-radius:26px;
    padding:17px 20px 19px;margin-bottom:10px;font-size:17px;line-height:1.45;
    box-shadow:0 12px 30px rgba(0,0,0,.3);white-space:pre-wrap}
  .moi{display:flex;justify-content:flex-end;margin-bottom:18px}
  .moi div{background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);
    border-radius:22px;padding:14px 18px 16px;font-size:17px;line-height:1.45;max-width:85%}
  .choix button{display:block;width:100%;text-align:left;margin-bottom:10px;
    background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.42);
    border-radius:26px;padding:17px 22px;color:var(--creme);
    font:500 17px "DM Sans";cursor:pointer;min-height:60px}
  .choix button:active{transform:scale(.99)}
  footer{display:flex;gap:10px;align-items:center;padding:8px 16px 18px}
  #champ{flex:1;background:#0C1020;border:1px solid rgba(167,139,250,.26);
    border-radius:22px;padding:14px 18px;color:var(--creme);font:400 16px "DM Sans";
    outline:none}
  #champ::placeholder{color:rgba(245,241,232,.42)}
  .rond{width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--violet),var(--bleu));
    box-shadow:0 6px 18px rgba(167,139,250,.35)}
  .rond.ecoute{background:#D9534F;box-shadow:none}
  .rond svg{width:24px;height:24px;fill:#fff}
  .points span{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--violet);margin-right:5px;animation:resp 1.1s infinite}
  .points span:nth-child(2){animation-delay:.15s}
  .points span:nth-child(3){animation-delay:.3s}
  @keyframes resp{0%,60%,100%{opacity:.3}30%{opacity:1}}
  dialog{border:0;border-radius:24px;background:#0C1322;color:var(--creme);
    padding:20px;max-width:380px;width:90%}
  dialog h3{font:500 19px "Playfair Display",serif;margin:0 0 14px}
  dialog button{display:block;width:100%;margin-bottom:8px;border-radius:14px;
    border:1px solid rgba(167,139,250,.3);background:rgba(255,255,255,.04);
    color:var(--creme);font:500 16px "DM Sans";padding:14px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <svg width="42" height="42" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#3B82F6"/>
      </linearGradient></defs>
      <path d="M20 22 L50 78 L80 22" fill="none" stroke="url(#g)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="22" r="8" fill="#A78BFA"/>
    </svg>
    <span class="nom">Victor</span>
    <span class="etat" id="etat">…</span>
  </header>
  <div class="reglages" id="reglages"></div>
  <div id="fil"></div>
  <footer>
    <input id="champ" placeholder="Dis-le à Victor…" autocomplete="off">
    <button class="rond" id="bouton" aria-label="Parler"></button>
  </footer>
</main>

<dialog id="feuille"><h3 id="feuilleTitre"></h3><div id="feuilleChoix"></div></dialog>

<script>
const API = "https://victor-vorey.onrender.com";
const LANGUE = (navigator.language || "fr").slice(0,2);

const REGLAGES = {
  avecQui:  {titre:"Avec qui ?",       vide:"Avec qui ?",        options:["Seul","Entre amis","En amoureux","En famille"]},
  envie:    {titre:"Pour quoi faire ?",vide:"Pour quoi faire ?", options:["Bien manger","Boire un verre","Sortir","Me détendre"]},
  ambiance: {titre:"Quelle ambiance ?",vide:"Quelle ambiance ?", options:["Calme","Élégante","Animée","Surprends-moi"]},
  distance: {titre:"Jusqu'où ?",       vide:"Jusqu'où ?",        options:["À pied","10 min","20 min","Peu importe"]},
};
const choisi = {};
let historique = [], position = null, premierContact = true, enAttente = false;

/* ── LES CHOIX ÉTIQUETÉS DEVIENNENT DES BOUTONS ─────────────────────
   Même découpage que l'app : on ne lit que ce que Victor a marqué
   lui-même, (a) (b) (c). Si la coupe n'est pas franche, on ne propose
   rien et la phrase reste du texte. */
function extraireChoix(texte){
  const m = [...texte.matchAll(/\(([a-z])\)\s*/gi)];
  if(m.length < 2 || m.length > 4) return [];
  for(let i=0;i<m.length;i++)
    if(m[i][1].toLowerCase() !== String.fromCharCode(97+i)) return [];
  const out = [];
  for(let i=0;i<m.length;i++){
    const d = m[i].index + m[i][0].length;
    const f = i+1 < m.length ? m[i+1].index : texte.length;
    let o = texte.slice(d,f).replace(/\s+/g," ").trim()
      .replace(/(\s*,?\s*\b(ou|or|o)\b\s*)?[\s,.;:!?…]*$/i,"").trim();
    if(!o || o.length > 80) return [];
    out.push(o);
  }
  return out;
}
function sansLesChoix(texte){
  if(!extraireChoix(texte).length) return texte;
  const i = texte.search(/\([a-z]\)/i);
  return texte.slice(0,i).replace(/\s*:\s*$/," ?").trim();
}
function enBulles(t){
  t = t.trim();
  if(t.length <= 115) return [t];
  const ph = t.match(/[^.!?…]+[.!?…]+(?=\s|$)|[^.!?…]+$/g) || [t];
  const out = []; let c = "";
  for(const p of ph.map(s=>s.trim())){
    if(!c) c = p;
    else if((c.length+1+p.length) <= 115) c += " " + p;
    else { out.push(c); c = p; }
  }
  if(c) out.push(c);
  return out.length > 3 ? [t] : out;
}

const fil = document.getElementById("fil");
const champ = document.getElementById("champ");
const bouton = document.getElementById("bouton");
const etat = document.getElementById("etat");

const MICRO = '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>';
const STOP  = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const FLECHE= '<svg viewBox="0 0 24 24"><path d="M12 4l-7 7h4v9h6v-9h4z"/></svg>';

function dessinerReglages(){
  const z = document.getElementById("reglages"); z.innerHTML = "";
  for(const [cle,r] of Object.entries(REGLAGES)){
    const b = document.createElement("button");
    b.textContent = choisi[cle] || r.vide;
    if(choisi[cle]) b.className = "rempli";
    b.onclick = () => ouvrirFeuille(cle);
    z.appendChild(b);
  }
}
function ouvrirFeuille(cle){
  const r = REGLAGES[cle];
  document.getElementById("feuilleTitre").textContent = r.titre;
  const z = document.getElementById("feuilleChoix"); z.innerHTML = "";
  for(const o of r.options){
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = () => { choisi[cle] = o; dessinerReglages();
      document.getElementById("feuille").close();
      envoyer("J'ai changé un réglage : " + o, {cache:true}); };
    z.appendChild(b);
  }
  document.getElementById("feuille").showModal();
}

function bulleMoi(texte){
  const d = document.createElement("div");
  d.className = "moi"; d.innerHTML = "<div></div>";
  d.firstChild.textContent = texte;
  fil.appendChild(d); versLeBas();
}
function attente(){
  const d = document.createElement("div");
  d.className = "lui"; d.id = "attente";
  d.innerHTML = '<div class="carte points"><span></span><span></span><span></span></div>';
  fil.appendChild(d); versLeBas();
}
async function ecrire(carte, texte){
  // 16 ms par caractère, comme dans l'app : on le voit écrire sans attendre.
  carte.textContent = "";
  for(let i=0;i<texte.length;i++){
    carte.textContent += texte[i];
    if(i % 2 === 0) await new Promise(r=>setTimeout(r,32));
    if(i % 12 === 0) versLeBas();
  }
}
async function bullesDeVictor(texte){
  const bloc = document.createElement("div"); bloc.className = "lui";
  fil.appendChild(bloc);
  for(const b of enBulles(sansLesChoix(texte))){
    const c = document.createElement("div"); c.className = "carte";
    bloc.appendChild(c); await ecrire(c, b);
  }
  const choix = extraireChoix(texte);
  if(choix.length){
    const z = document.createElement("div"); z.className = "choix";
    for(const o of choix){
      const b = document.createElement("button");
      b.textContent = o;
      b.onclick = () => { z.remove(); envoyer(o); };
      z.appendChild(b);
    }
    bloc.appendChild(z);
  }
  versLeBas();
}
function versLeBas(){ fil.scrollTop = fil.scrollHeight; }

async function envoyer(texte, opt = {}){
  if(enAttente) return;
  enAttente = true; majBouton();
  if(!opt.cache) bulleMoi(texte);
  attente();
  etat.textContent = "il réfléchit…";
  const corps = {
    message: texte, language: LANGUE, history: historique.slice(-12),
    userProfile: {gouts: Object.values(choisi)},
  };
  if(position){ corps.lat = position[0]; corps.lon = position[1]; }
  if(opt.ouverture){ corps.ouverture = true; if(premierContact) corps.premier_contact = true; }
  let reponse = "";
  try{
    const r = await fetch(API + "/chat", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(corps)});
    const d = await r.json();
    reponse = d.reply || d.error || "";
  }catch(e){ reponse = "Je n'arrive pas à joindre mon cerveau là, réessaie dans un instant."; }
  document.getElementById("attente")?.remove();
  historique.push({role:"user", content:texte});
  historique.push({role:"assistant", content:reponse});
  if(opt.ouverture) premierContact = false;
  await bullesDeVictor(reponse);
  enAttente = false; etat.textContent = ""; majBouton();
}

/* ── LA VOIX ────────────────────────────────────────────────────────
   Trois formats essayés dans l'ordre : Safari ne sait pas produire de
   l'Opus, il enregistre de l'AAC dans du MP4. */
let recorder = null, morceaux = [], extension = "webm";
const FORMATS = [["audio/webm;codecs=opus","webm"],["audio/mp4","m4a"],["audio/webm","webm"]];

async function basculerMicro(){
  if(recorder && recorder.state === "recording"){ recorder.stop(); return; }
  try{
    const flux = await navigator.mediaDevices.getUserMedia({audio:true});
    let type = "";
    for(const [t,e] of FORMATS)
      if(MediaRecorder.isTypeSupported(t)){ type = t; extension = e; break; }
    recorder = new MediaRecorder(flux, type ? {mimeType:type} : undefined);
    morceaux = [];
    recorder.ondataavailable = e => morceaux.push(e.data);
    recorder.onstop = async () => {
      flux.getTracks().forEach(t=>t.stop());
      majBouton();
      const blob = new Blob(morceaux, {type: recorder.mimeType});
      if(blob.size < 2000) return;
      etat.textContent = "il écoute…";
      const fd = new FormData();
      fd.append("audio", blob, "voix." + extension);
      fd.append("language", LANGUE);
      try{
        const r = await fetch(API + "/transcribe", {method:"POST", body: fd});
        const d = await r.json();
        if(d.text) envoyer(d.text); else etat.textContent = "rien entendu";
      }catch(e){ etat.textContent = "écoute impossible"; }
    };
    recorder.start();
    majBouton();
  }catch(e){
    etat.textContent = "micro refusé";
  }
}

function majBouton(){
  const ecoute = recorder && recorder.state === "recording";
  bouton.classList.toggle("ecoute", !!ecoute);
  if(ecoute){ bouton.innerHTML = STOP; bouton.onclick = basculerMicro; return; }
  if(champ.value.trim()){ bouton.innerHTML = FLECHE;
    bouton.onclick = () => { const t = champ.value.trim(); champ.value=""; majBouton(); envoyer(t); };
  } else { bouton.innerHTML = MICRO; bouton.onclick = basculerMicro; }
}
champ.addEventListener("input", majBouton);
champ.addEventListener("keydown", e => { if(e.key === "Enter") bouton.onclick(); });

/* ── OUVERTURE ──────────────────────────────────────────────────── */
dessinerReglages(); majBouton();
navigator.geolocation?.getCurrentPosition(
  p => { position = [p.coords.latitude, p.coords.longitude];
         etat.textContent = ""; },
  () => {}, {timeout:8000, maximumAge:600000});
/* LE BACKEND REFUSE UN MESSAGE VIDE, et il a raison : une requête sans
   message est une erreur partout ailleurs. L'ouverture envoie donc le
   résumé des réglages, comme le fait l'app, et le prompt sait que ce
   n'est pas une phrase tapée par quelqu'un. */
function resumeDesReglages(){
  const v = Object.values(choisi).filter(Boolean);
  return v.length ? "Voilà ma soirée : " + v.join(", ")
                  : "(elle vient d'ouvrir la conversation)";
}
envoyer(resumeDesReglages(), {ouverture:true, cache:true});
</script>
</body>
</html>
