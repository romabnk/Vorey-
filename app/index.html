<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- SANS CELUI-CI, iOS ouvre le raccourci DANS Safari, avec sa barre
       d'adresse : ça n'a plus l'air d'une application. Les iPhone plus
       anciens ne lisent que cette balise-là. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vorey">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">

  <!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Vorey · Marbella</title>
  <link rel="manifest" href="manifest.json">

  <!-- Le tout premier frame natif (avant que Flutter ne peigne) doit déjà
       afficher le fond officiel de Vorey — sinon flash blanc pendant l'init
       (Supabase + locale) qui précède runApp. Couleur = splash (_bg night). -->
  <meta name="theme-color" content="#0A0E1A">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0A0E1A;
    }

    /* ══════════════════════════════════════════════════════════════════
       L'ÉCRAN D'ATTENTE, EN HTML PUR.

       POURQUOI IL EXISTE. Le premier chargement télécharge 6,2 Mo de
       code, 6,8 Mo de moteur graphique et la vidéo d'intro AVANT de
       pouvoir peindre quoi que ce soit. Mesuré en fibre : quatorze
       secondes d'écran noir. Sur un téléphone en 4G, davantage. Un écran
       noir de quatorze secondes, ce n'est pas une app qui charge, c'est
       une app cassée.

       Celui-ci s'affiche en quelques millisecondes parce qu'il ne
       télécharge RIEN : pas d'image, pas de police, pas de script. Il
       dit juste que quelque chose arrive, et il s'efface tout seul dès
       que Flutter prend la main.
       ══════════════════════════════════════════════════════════════════ */
    #vorey-attente {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: radial-gradient(
          120% 80% at 50% 8%, #171034 0%, rgba(10, 14, 26, 0) 70%),
        #0A0E1A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      transition: opacity 420ms ease-out;
    }
    #vorey-attente.parti { opacity: 0; pointer-events: none; }
    #vorey-attente .nom {
      color: #F5F1E8;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    #vorey-attente .lieu {
      color: rgba(245, 241, 232, 0.42);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: -16px;
    }
    #vorey-attente .piste {
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: rgba(245, 241, 232, 0.12);
      overflow: hidden;
    }
    #vorey-attente .piste i {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #A78BFA, #3B82F6);
      animation: vorey-va-et-vient 1400ms ease-in-out infinite;
    }
    @keyframes vorey-va-et-vient {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
    /* Mouvement réduit : la barre ne court plus, elle reste posée. */
    @media (prefers-reduced-motion: reduce) {
      #vorey-attente .piste i { animation: none; width: 100%; opacity: 0.5; }
      #vorey-attente { transition: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Preview Vorey : neutralise tout service worker résiduel qui resservirait
       une ancienne version en cache. À chaque chargement on désenregistre les
       SW et on vide les caches. Aucun SW n'est réinstallé (build construit avec
       --pwa-strategy=none). Résultat : toujours la version à jour. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  </script>
  <div id="vorey-attente" role="status" aria-live="polite">
    <div class="nom">Vorey</div>
    <div class="lieu">Marbella</div>
    <div class="piste"><i></i></div>
  </div>
  <script>
    // Il s'efface dès que Flutter a posé sa vue, et pas une image avant.
    (function () {
      var voile = document.getElementById('vorey-attente');
      if (!voile) return;
      function partir() {
        if (!voile || voile.classList.contains('parti')) return;
        voile.classList.add('parti');
        setTimeout(function () {
          if (voile && voile.parentNode) voile.parentNode.removeChild(voile);
        }, 500);
      }
      if (document.querySelector('flutter-view')) { partir(); return; }
      var oeil = new MutationObserver(function () {
        if (document.querySelector('flutter-view')) { oeil.disconnect(); partir(); }
      });
      oeil.observe(document.body, { childList: true, subtree: true });
      // FILET DE SÉCURITÉ : si Flutter ne démarre jamais, le voile ne
      // doit pas rester là à tourner pour l'éternité.
      setTimeout(function () { oeil.disconnect(); partir(); }, 60000);
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20261019164806" async></script>
</body>
</html>
